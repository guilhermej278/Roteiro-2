<!DOCTYPE html>
<html lang="pt-BR">
<head>

<nav aria-label="Principal">

<section><div class="wrap narrow">
<h2>Entrar</h2>
<form id="log">
<label for="email">E-mail</label><input id="email" type="text" required autocomplete="username">
<label for="senha">Senha</label><input id="senha" type="password" required autocomplete="current-password">
<p style="margin-top:20px"><button class="btn" type="submit">Entrar</button></p>
<div class="err" id="err" role="alert"></div>
<div class="ok" id="ok" role="status"></div>
</form>
<p style="margin-top:22px">Ainda não tem conta? <a href="cadastro.html"><b>Criar conta</b></a></p>
</div></section>
<script src="script.js"></script>
